<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Story FM - Premium Audio Stories</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0F0518, #000000);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        h1 span {
            color: #FFD700;
        }
        p {
            font-size: 1.2rem;
            color: #cccccc;
            margin-bottom: 30px;
        }
        .banner {
            border: 2px solid #FFD700;
            border-radius: 30px;
            padding: 10px 30px;
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 40px;
            color: white;
        }
        
        /* Naya Button Style */
        .start-btn {
            background-color: #FFD700;
            color: #0F0518;
            border: none;
            padding: 15px 40px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
            margin-bottom: 20px;
        }
        .start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.5);
        }
        .start-btn:active {
            transform: scale(0.95);
        }

        #root:empty {
            display: none;
        }
    </style>
</head>
<body>
    <div id="landing-content">
        <h1>ALL STORY <span>FM</span></h1>
        <div class="banner">60+ AUDIO STORIES</div>
        <p>Listen Anytime, Anywhere. High Quality Audio Experience.</p>
        
        <!-- Naya Button Add Kiya Gaya Hai -->
        <button class="start-btn" onclick="startApp()">Start Listening</button>
        
        <p style="font-size: 0.9rem; color: #888; margin-top: 50px;">Admin Panel & API Server is Active.</p>
    </div>

    <div id="root"></div>

    <script>
        // Button click hone par kya hoga, wo yahan define karein
        function startApp() {
            // Agar aapka app kisi aur link par hai, toh ise use karein:
            // window.location.href = 'AAPKE_APP_KA_LINK_YAHAN_DAALEIN';
            
            // Abhi ke liye ek simple alert dega taaki pata chale button kaam kar raha hai
            alert("Welcome to All Story FM! App is loading...");
        }
    </script>
</body>
</html>
