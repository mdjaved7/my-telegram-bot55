<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Story FM</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: Arial; background-color: #121212; color: white; margin: 0; padding: 15px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .card { background: #1e1e1e; padding: 10px; border-radius: 10px; text-align: center; }
        .card img { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; }
        .btn { background: #e50914; color: white; border: none; padding: 8px; width: 100%; border-radius: 5px; cursor: pointer; margin-top: 10px;}
        #checkout { display: none; background: #1e1e1e; padding: 20px; border-radius: 10px; text-align: center; margin-top: 20px;}
        #checkout img { width: 200px; border-radius: 10px; margin: 10px 0;}
    </style>
</head>
<body>
    <h2 style="text-align: center;">All Story FM Premium</h2>
    
    <div id="store-page" class="grid">
        {% for story in stories %}
        <div class="card">
            <img src="{{ story.image }}" alt="Cover">
            <h4>{{ story.title }}</h4>
            <p style="color: gold;">₹{{ story.price }}</p>
            <button class="btn" onclick="buyStory('{{ story.id }}', '{{ story.title }}', '{{ story.price }}')">Buy Now</button>
        </div>
        {% endfor %}
    </div>

    <div id="checkout">
        <h3>Checkout</h3>
        <p id="checkout-item"></p>
        <p>Scan & Pay Here:</p>
        <img src="{{ qr_code }}" alt="UPI QR">
        <form id="paymentForm">
            <input type="file" id="screenshot" accept="image/*" required style="margin: 15px 0;">
            <button class="btn" type="submit" id="submitBtn">Upload & Verify</button>
        </form>
        <p id="status" style="color: lightgreen; margin-top: 10px;"></p>
        <button class="btn" style="background: #333;" onclick="cancelBuy()">Back to Store</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        let currentStory = {};

        function buyStory(id, title, price) {
            currentStory = { id, title, price };
            document.getElementById('store-page').style.display = 'none';
            document.getElementById('checkout').style.display = 'block';
            document.getElementById('checkout-item').innerText = title + " - ₹" + price;
        }

        function cancelBuy() {
            document.getElementById('store-page').style.display = 'grid';
            document.getElementById('checkout').style.display = 'none';
        }

        document.getElementById('paymentForm').addEventListener('submit', function(e) {
            e.preventDefault();
            let fileInput = document.getElementById('screenshot');
            let btn = document.getElementById('submitBtn');
            let status = document.getElementById('status');

            btn.disabled = true;
            btn.innerText = "Uploading...";

            let formData = new FormData();
            formData.append("screenshot", fileInput.files[0]);
            formData.append("user_id", tg.initDataUnsafe?.user?.id || "AdminTest_123");
            formData.append("story_id", currentStory.id);
            formData.append("story_title", currentStory.title);
            formData.append("price", currentStory.price);

            fetch('/api/upload_payment', { method: 'POST', body: formData })
            .then(res => res.json())
            .then(data => {
                status.innerText = "Screenshot sent! Admin is verifying...";
                btn.innerText = "Done ✅";
            });
        });
    </script>
</body>
</html>
