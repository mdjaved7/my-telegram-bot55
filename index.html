<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Story FM - Premium Audio Stories</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0F0518, #000000);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        h1 span {
            color: #FFD700;
        }
        p {
            font-size: 1.2rem;
            color: #cccccc;
            margin-bottom: 30px;
        }
        .banner {
            border: 2px solid #FFD700;
            border-radius: 30px;
            padding: 10px 30px;
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 40px;
            color: white;
        }
        
        .start-btn {
            background-color: #FFD700;
            color: #0F0518;
            border: none;
            padding: 15px 40px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
            margin-bottom: 20px;
        }
        .start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.5);
        }

        .admin-link {
            font-size: 0.9rem;
            color: #888;
            margin-top: 50px;
            cursor: pointer;
            text-decoration: underline;
        }
        .admin-link:hover {
            color: #FFD700;
        }

        /* Admin Panel Hide Rahega Default */
        #admin-panel {
            display: none;
            margin-top: 30px;
            padding: 20px;
            border: 1px solid #FFD700;
            border-radius: 15px;
            background: rgba(255, 215, 0, 0.1);
            width: 80%;
            max-width: 600px;
        }
        
        #root:empty {
            display: none;
        }
    </style>
</head>
<body>
    <div id="landing-content">
        <h1>ALL STORY <span>FM</span></h1>
        <div class="banner">60+ AUDIO STORIES</div>
        <p>Listen Anytime, Anywhere. High Quality Audio Experience.</p>
        
        <!-- Pocket FM jaisa page kholne ke liye button -->
        <button class="start-btn" onclick="startApp()">Start Listening</button>
        
        <br>
        <!-- Admin Panel Access Link -->
        <p class="admin-link" onclick="openAdmin()">Admin Panel & API Server is Active (Login Required)</p>
        
        <!-- Admin Panel Section (Code dalne par dikhega) -->
        <div id="admin-panel">
            <h2 style="color: #FFD700;">Welcome Admin: M.D. Javed</h2>
            <p>Admin Dashboard unlocked successfully!</p>
            <!-- React Admin Panel ya baaki admin code yahan load kar sakte hain -->
            <button class="start-btn" style="font-size: 1rem; padding: 10px 20px;" onclick="alert('React Admin Panel loading...')">Manage Stories</button>
        </div>
    </div>

    <div id="root"></div>

    <script>
        // Start Listening par click karne ka logic
        function startApp() {
            // Abhi alert diya hai, agar app ka alag page hai toh redirect laga sakte hain
            alert("Pocket FM style audio player load ho raha hai...");
            // Example: window.location.href = '/player'; 
        }

        // Admin Panel kholne ka logic
        function openAdmin() {
            let code = prompt("Kripya Admin Panel Code Darj Karein:");
            
            if (code != null) {
                // Code ko thoda flexible rakha hai taaki case ya dots ki wajah se error na aaye
                let checkCode = code.toLowerCase().trim();
                if (checkCode === "m.d. javed 786" || checkCode === "md javed 786") {
                    alert("Access Granted! Welcome M.D. Javed.");
                    document.getElementById("admin-panel").style.display = "block";
                } else {
                    alert("Wrong Code! Access Denied.");
                }
            }
        }
    </script>
</body>
</html>
