<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Story Upload</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #121212; 
            color: white; 
            padding: 20px; 
        }
        .container { 
            max-width: 500px; 
            margin: auto; 
            background: #1e1e1e; 
            padding: 20px; 
            border-radius: 10px; 
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        input, textarea, button { 
            width: 100%; 
            margin-top: 10px; 
            padding: 10px; 
            border-radius: 5px; 
            border: none; 
            box-sizing: border-box;
        }
        input, textarea { background: #333; color: white; }
        button { background: #e50914; color: white; font-weight: bold; cursor: pointer; margin-top: 20px; }
        button:hover { background: #b20710; }
        #status { margin-top: 15px; color: #4caf50; font-weight: bold; text-align: center; }
        label { display: block; margin-top: 15px; font-size: 14px; color: #aaa; }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="text-align: center;">स्टोरी अपलोड करें</h2>
        
        <input type="text" id="storyTitle" placeholder="स्टोरी का नाम (Title)" required>
        
        <label for="storyImage">स्टोरी का कवर इमेज (.jpg, .png):</label>
        <input type="file" id="storyImage" accept="image/*" required>
        
        <label for="storyAudio">स्टोरी का ऑडियो फाइल (.mp3):</label>
        <input type="file" id="storyAudio" accept="audio/*" required>
        
        <textarea id="storyDesc" rows="4" placeholder="स्टोरी के बारे में थोड़ा लिखें..." required></textarea>
        
        <button id="uploadBtn" onclick="uploadStory()">अपलोड करें</button>
        <p id="status"></p>
    </div>

    <!-- Firebase SDKs (HTML के लिए सबसे आसान तरीका) -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-storage-compat.js"></script>

    <script>
        // 1. यहाँ अपना Firebase Config डालें (यह आपको Firebase Console से मिलेगा)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Firebase को Initialize करें
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const storage = firebase.storage();

        async function uploadStory() {
            const title = document.getElementById('storyTitle').value;
            const desc = document.getElementById('storyDesc').value;
            const imageFile = document.getElementById('storyImage').files[0];
            const audioFile = document.getElementById('storyAudio').files[0];
            const statusText = document.getElementById('status');
            const uploadBtn = document.getElementById('uploadBtn');

            if (!title || !imageFile || !audioFile) {
                alert("कृपया सभी फ़ील्ड भरें!");
                return;
            }

            statusText.style.color = "#ffa500";
            statusText.innerText = "अपलोड हो रहा है... कृपया पेज बंद न करें।";
            uploadBtn.disabled = true;

            try {
                // इमेज अपलोड करें और लिंक प्राप्त करें
                const imageRef = storage.ref(`images/${Date.now()}_${imageFile.name}`);
                await imageRef.put(imageFile);
                const imageUrl = await imageRef.getDownloadURL();

                // ऑडियो अपलोड करें और लिंक प्राप्त करें
                const audioRef = storage.ref(`audios/${Date.now()}_${audioFile.name}`);
                await audioRef.put(audioFile);
                const audioUrl = await audioRef.getDownloadURL();

                // डेटाबेस में स्टोरी की सारी जानकारी सेव करें
                await db.collection("stories").add({
                    title: title,
                    description: desc,
                    imageUrl: imageUrl,
                    audioUrl: audioUrl,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                statusText.style.color = "#4caf50";
                statusText.innerText = "स्टोरी सफलतापूर्वक अपलोड हो गई!";
                
                // अपलोड के बाद फॉर्म खाली कर दें
                document.getElementById('storyTitle').value = "";
                document.getElementById('storyDesc').value = "";
                document.getElementById('storyImage').value = "";
                document.getElementById('storyAudio').value = "";

            } catch (error) {
                console.error("Upload Error: ", error);
                statusText.style.color = "red";
                statusText.innerText = "अपलोड फेल हो गया: " + error.message;
            } finally {
                uploadBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
