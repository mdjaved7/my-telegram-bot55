<!DOCTYPE html>
<html lang="hi">
<head>
    <title>Admin Dashboard</title>
    <style>
        body { font-family: Arial; background: #f4f4f4; padding: 20px; }
        .box { background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input { display: block; width: 100%; margin: 10px 0; padding: 10px; box-sizing: border-box; }
        button { background: #28a745; color: white; padding: 10px; border: none; cursor: pointer; width: 100%; }
    </style>
</head>
<body>
    <h2>Admin Dashboard - All Story FM</h2>

    <div class="box">
        <h3>1. Update Payment QR Code</h3>
        <input type="text" id="qr_url" placeholder="Paste QR Code Image URL here">
        <button onclick="updateQR()">Update QR</button>
    </div>

    <div class="box">
        <h3>2. Add New Story</h3>
        <input type="text" id="title" placeholder="Story Title (e.g. Mystery S01)">
        <input type="text" id="price" placeholder="Price (e.g. 99)">
        <input type="text" id="image_url" placeholder="Cover Image URL">
        <input type="text" id="access_link" placeholder="Story Access Link / Private Channel Link">
        <button onclick="addStory()">Upload Story</button>
    </div>

    <script>
        function updateQR() {
            let formData = new FormData();
            formData.append("qr_url", document.getElementById('qr_url').value);
            fetch('/api/update_qr', { method: 'POST', body: formData }).then(()=> alert("QR Updated!"));
        }

        function addStory() {
            let formData = new FormData();
            formData.append("title", document.getElementById('title').value);
            formData.append("price", document.getElementById('price').value);
            formData.append("image_url", document.getElementById('image_url').value);
            formData.append("access_link", document.getElementById('access_link').value);
            
            fetch('/api/add_story', { method: 'POST', body: formData }).then(()=> {
                alert("Story Added!");
                window.location.reload();
            });
        }
    </script>
</body>
</html>
